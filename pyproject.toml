[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai624-a1"
version = "0.1.0"
description = "AI624 Project A1: long-context tool-calling agent on a Raspberry Pi 5"
requires-python = ">=3.10"
# NOTE: bfcl-eval is installed separately with `pip install --no-deps bfcl-eval==2026.3.23`
# because its full dependency list pulls in torch, CUDA and many cloud SDKs we do not need.
# See src/bfcl/README.md.
dependencies = [
    "mpmath==1.3.0",   # needed by BFCL's MathAPI backend
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
